<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>
        Sign Up - MovieHub
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header>

    <h1>
        🎬 MovieHub
    </h1>

</header>


<main>

    <div class="auth-box">

        <h2>
            Create Account
        </h2>


        <form id="signupForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >


            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button type="submit">

                Create Account

            </button>

        </form>


        <p>

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</main>


<script src="signup.js"></script>

</body>

</html>
