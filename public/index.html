<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MovieHub</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header>

    <div class="header-content">

        <h1>🎬 MovieHub</h1>

        <p>Discover movies you'll love</p>

    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="profile.html">
            🔖 My Bookmarks
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="signup.html">
            Sign Up
        </a>

        <a
            href="#"
            onclick="logout()"
        >
            Logout
        </a>

        <span id="usernameDisplay"></span>

    </nav>

</header>


<main>

    <section class="hero">

        <h2>
            Discover Your Next Favourite Movie 🎥
        </h2>

        <p>
            Explore movies, read reviews and save your favourites.
        </p>

    </section>


    <section class="search-section">

        <input
            type="text"
            id="search"
            placeholder="Search movies..."
        >

        <button onclick="searchMovies()">
            🔍 Search
        </button>

        <button onclick="loadMovies()">
            Show All
        </button>

    </section>


    <section>

        <h2>🎬 All Movies</h2>

        <div
            id="movies"
            class="movies-container"
        >

            <p>
                Loading movies...
            </p>

        </div>

    </section>

</main>


<footer>

    <p>
        🎬 MovieHub
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
