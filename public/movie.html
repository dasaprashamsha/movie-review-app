<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>
        Movie Details - MovieHub
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header>

    <h1>
        🎬 MovieHub
    </h1>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="profile.html">
            My Bookmarks
        </a>

    </nav>

</header>


<main>

    <div id="movieDetails">

        Loading movie...

    </div>


    <section class="review-section">

        <h2>
            ⭐ Write a Review
        </h2>


        <form id="reviewForm">

            <label>
                Your Rating
            </label>


            <select
                id="rating"
                required
            >

                <option value="">
                    Select rating
                </option>

                <option value="1">
                    ⭐ 1
                </option>

                <option value="2">
                    ⭐ 2
                </option>

                <option value="3">
                    ⭐ 3
                </option>

                <option value="4">
                    ⭐ 4
                </option>

                <option value="5">
                    ⭐ 5
                </option>

            </select>


            <textarea
                id="review"
                placeholder="Write your review..."
                required
            ></textarea>


            <button type="submit">

                Submit Review

            </button>

        </form>

    </section>


    <section>

        <h2>
            💬 User Reviews
        </h2>


        <div id="reviews">

            Loading reviews...

        </div>

    </section>

</main>


<script src="movie.js"></script>

</body>

</html>
