<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>
        Login - MovieHub
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header>

    <h1>
        🎬 MovieHub
    </h1>

</header>


<main>

    <div class="auth-box">

        <h2>
            Login
        </h2>


        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button type="submit">

                Login

            </button>

        </form>


        <p>

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>

    </div>

</main>


<script src="login.js"></script>

</body>

</html>
